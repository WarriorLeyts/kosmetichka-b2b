# test.kosmetichka-opt.ru — тесты для сотрудников.
# Живой файл: /etc/nginx/sites-enabled/kosmetichka-test (ставит deploy/academy-setup.sh).
# HTTPS (listen 443, сертификат, редирект с http) дописывает certbot --nginx.
#
# Поддомен — тот же сайт (127.0.0.1:3000), но наружу открыт только раздел тестов:
# магазин, админка и остальное API здесь недоступны.

server {
    listen 80;
    listen [::]:80;
    server_name test.kosmetichka-opt.ru;

    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / { return 302 /academy; }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ^~ /academy        { include snippets/kosmetichka-test-proxy.conf; }
    location ^~ /api/academy/   { include snippets/kosmetichka-test-proxy.conf; }
    location = /api/admin/login  { include snippets/kosmetichka-test-proxy.conf; }
    location = /api/admin/logout { include snippets/kosmetichka-test-proxy.conf; }
    location ^~ /_next/         { include snippets/kosmetichka-test-proxy.conf; }
    location ~ ^/favicon\.(svg|ico)$ { include snippets/kosmetichka-test-proxy.conf; }

    # Всё остальное — на тесты
    location / { return 302 /academy; }
}
