# /etc/nginx/conf.d/kosmetichka-images-map.conf — для snippets/kosmetichka-images.conf
# ?w=<стандартная ширина> → папка готовой уменьшенной копии; иначе путь, которого нет
map $arg_w $kos_thumb_dir {
    ~^(?<kw>160|320|480|800|1200)$ /1c/.thumbs/w$kw/;
    default /__none__/;
}
# оригинал отдаём только без ?w (с нестандартной шириной — пусть сайт подберёт копию)
map $arg_w $kos_orig_dir {
    ""      /1c/;
    default /__none__/;
}
