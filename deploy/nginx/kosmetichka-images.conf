# /etc/nginx/snippets/kosmetichka-images.conf
# Фото товаров из 1С отдаёт nginx напрямую, без сайта (Next.js):
#   /1c/<путь>.jpg            → оригинал с диска
#   /1c/<путь>.jpg?w=480      → готовая уменьшенная копия data/1c/.thumbs/w480/<путь>.jpg.webp
# Если копии ещё нет или ширина нестандартная — запрос уходит сайту (@kos_site), он делает копию.
# Переменные $kos_thumb_dir / $kos_orig_dir — conf.d/kosmetichka-images-map.conf.
root /root/kosmetichka-data;
add_header Cache-Control "public, max-age=2592000, immutable";
try_files $kos_thumb_dir$kos_img.webp $kos_orig_dir$kos_img @kos_site;
