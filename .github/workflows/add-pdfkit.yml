name: Add pdfkit (one-off)
# Installs the PDF library on this branch (the local machine has no npm registry access), commits
# package.json + package-lock.json and removes this file in the same commit.
on:
  push:
    branches: [invoice-pdf]
    paths: [".github/workflows/add-pdfkit.yml"]
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund pdfkit@^0.17.2 && npm install --no-audit --no-fund -D @types/pdfkit@^0.17.2
      - run: |
          git rm -q .github/workflows/add-pdfkit.yml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add pdfkit (invoice PDF)"
          git push
