name: Restore audited catalog prices from 1C
on:
  push:
    branches: [codex/diagnose-promo-import]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check import state without exporting production data
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o ServerAliveInterval=30 "${USER:-root}@$HOST" "bash -lc 'node --no-warnings'" <<'NODE'
          const fs=require("fs"),path=require("path"),cp=require("child_process");
          let phase="PROCESS";
          (async()=>{
          const apps=JSON.parse(cp.execFileSync("pm2",["jlist"],{encoding:"utf8",maxBuffer:20*1024*1024}));
          const app=apps.find(a=>a.name==="kosmetichka");if(!app)throw Error("no_app");
          const meta=app.pm2_env,cwd=meta.pm_cwd;
          const execDir=path.dirname(meta.pm_exec_path||cwd);
          const roots=[meta.APP_ROOT,meta.env?.APP_ROOT,cwd,path.resolve(cwd,"../.."),execDir,path.resolve(execDir,"../..")].filter(Boolean);
          const root=roots.find(p=>fs.existsSync(path.join(p,"scripts/import-prices.js")))||cwd;
          phase="ENVIRONMENT";
          process.chdir(cwd);
          for(const p of [path.join(root,".env"),path.join(cwd,".env")])if(fs.existsSync(p)&&process.loadEnvFile)process.loadEnvFile(p);
          for(const k of ["DATABASE_URL","DATA_DIR","APP_ROOT"])if(meta[k]||meta.env?.[k])process.env[k]=meta[k]||meta.env[k];
          const req=require("module").createRequire(path.join(root,"package.json"));
          const say=code=>console.log("PRICE_IMPORT_RESULT: "+code);
          phase="AUDIT_VALIDATE";
          const dir=path.join(require("os").homedir(),".kosmetichka-private-backups");
          const pointer=JSON.parse(fs.readFileSync(path.join(dir,"catalog-price-audit-latest.json"),"utf8"));
          const auditPath=fs.realpathSync(pointer.auditPath);
          if(!auditPath.startsWith(fs.realpathSync(dir)+path.sep)||!path.basename(auditPath).startsWith("catalog-price-audit-"))throw Error("invalid_audit_path");
          const report=JSON.parse(fs.readFileSync(auditPath,"utf8"));
          const age=Date.now()-Date.parse(report.at);
          if(!report.complete||!Number.isFinite(age)||age<0||age>15*60*1000)throw Error("stale_audit");
          const allowed=["retail","discount","wholesale","big_wholesale","promo_retail","promo_wholesale","promo_big_wholesale"];
          const hash=require("crypto").createHash("sha256").update(JSON.stringify(report.allSource)).digest("hex");
          if(hash!==report.sourceDigest)throw Error("audit_changed");
          const keyOf=p=>p.productGuid+"|"+p.priceType;
          const source=new Map();
          for(const row of report.allSource){
          if(!allowed.includes(row.priceType)||typeof row.productGuid!=="string"||!Number.isFinite(row.price)||row.price<0||source.has(keyOf(row)))throw Error("invalid_source");
          source.set(keyOf(row),row);
          }
          const beforeMap=new Map(report.before.map(p=>[keyOf(p),p]));
          phase="DATABASE";
          const {PrismaClient}=req("@prisma/client");const db=new PrismaClient();
          try{
          let changed=[],backupPath;
          await db.$transaction(async tx=>{
          phase="CONCURRENT_PRICE_CHECK";
          await tx.$executeRawUnsafe('LOCK TABLE "ProductPrice" IN SHARE ROW EXCLUSIVE MODE');
          const fresh=await tx.productPrice.findMany({where:{priceType:{in:allowed}}});
          const live=new Map(fresh.map(p=>[keyOf(p),p]));
          for(const [key,row] of source){
          const current=live.get(key),before=beforeMap.get(key);
          if(current?.price===row.price)continue;
          if(current?.price!==before?.price||String(current?.updatedAt?.toISOString())!==String(before?.updatedAt))throw Error("prices_changed_after_audit");
          changed.push(row);
          }
          const flags=await tx.product.findMany({select:{guid:true,hasDiscount:true,hidden:true,id:true}});
          const validGuids=new Set(flags.map(p=>p.guid));
          if(changed.some(p=>!validGuids.has(p.productGuid)))throw Error("catalog_changed_after_audit");
          phase="BACKUP";
          fs.chmodSync(dir,0o700);
          backupPath=path.join(dir,"catalog-price-recovery-"+Date.now()+".json");
          fs.writeFileSync(backupPath,JSON.stringify({at:new Date().toISOString(),auditPath,sourceDigest:report.sourceDigest,before:fresh,productFlags:flags,planned:changed}),{mode:0o600,flag:"wx"});
          phase="PRICE_WRITE";
          const sql='INSERT INTO "ProductPrice" ("productGuid","priceType","price","createdAt","updatedAt") SELECT x."productGuid",x."priceType",x.price,NOW(),NOW() FROM jsonb_to_recordset($1::jsonb) AS x("productGuid" text,"priceType" text,price double precision) ON CONFLICT ("productGuid","priceType") DO UPDATE SET price=EXCLUDED.price,"updatedAt"=NOW() WHERE "ProductPrice".price IS DISTINCT FROM EXCLUDED.price';
          for(let i=0;i<changed.length;i+=500)await tx.$executeRawUnsafe(sql,JSON.stringify(changed.slice(i,i+500)));
          phase="PRICE_VERIFY";
          const after=await tx.productPrice.findMany({where:{priceType:{in:allowed}},select:{productGuid:true,priceType:true,price:true}});
          const checked=new Map(after.map(p=>[keyOf(p),p.price]));
          if([...source].some(([key,row])=>checked.get(key)!==row.price))throw Error("post_write_mismatch");
          },{timeout:60000,maxWait:10000});
          const result={at:new Date().toISOString(),sourceDigest:report.sourceDigest,changedPrices:changed.length,changedProducts:new Set(changed.map(p=>p.productGuid)).size,verifiedRows:source.size,backupPath};
          fs.writeFileSync(path.join(dir,"catalog-price-recovery-result-"+Date.now()+".json"),JSON.stringify(result),{mode:0o600,flag:"wx"});
          say(changed.length?"CATALOG_PRICES_RESTORED_FROM_1C_WITH_PRIVATE_BACKUP":"CATALOG_PRICES_ALREADY_CURRENT");
          say("ALL_AUDITED_PRICES_VERIFIED_AFTER_TRANSACTION");
          phase="PUBLIC_CHECK";
          const changedGuids=[...new Set(changed.map(p=>p.productGuid))];
          const sample=changedGuids.length?await db.product.findFirst({where:{guid:{in:changedGuids},hidden:false,prices:{some:{priceType:{in:["promo_wholesale","promo_big_wholesale"]},price:{gt:0}}}},select:{id:true}}):null;
          if(sample){
          const response=await fetch("http://127.0.0.1:3000/api/products/"+sample.id,{headers:{Host:"kosmetichka-opt.ru","X-Forwarded-Proto":"https"},signal:AbortSignal.timeout(15000)}).catch(()=>null);
          if(response?.ok)console.log("PUBLIC_REPAIRED_PRODUCT: https://kosmetichka-opt.ru/product/"+sample.id);
          }
          }finally{await db.$disconnect();}
          })().catch(e=>{const own=["invalid_audit_path","stale_audit","audit_changed","invalid_source","prices_changed_after_audit","catalog_changed_after_audit","post_write_mismatch"];const code=own.includes(e?.message)?e.message.toUpperCase():"ERROR";console.error("PRICE_IMPORT_RESULT: RECOVERY_FAILED_"+phase+"_"+code);process.exitCode=1;});
          NODE
