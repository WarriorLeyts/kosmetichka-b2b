name: Recover received promotion prices
on:
  push:
    branches: [codex/diagnose-promo-import]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check import state without exporting production data
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o ServerAliveInterval=30 "${USER:-root}@$HOST" "bash -lc 'node --no-warnings'" <<'NODE'
          const fs=require("fs"),path=require("path"),cp=require("child_process");
          let phase="PROCESS";
          (async()=>{
          const apps=JSON.parse(cp.execFileSync("pm2",["jlist"],{encoding:"utf8",maxBuffer:20*1024*1024}));
          const app=apps.find(a=>a.name==="kosmetichka");if(!app)throw Error("no_app");
          const meta=app.pm2_env,cwd=meta.pm_cwd;
          const execDir=path.dirname(meta.pm_exec_path||cwd);
          const roots=[meta.APP_ROOT,meta.env?.APP_ROOT,cwd,path.resolve(cwd,"../.."),execDir,path.resolve(execDir,"../..")].filter(Boolean);
          const root=roots.find(p=>fs.existsSync(path.join(p,"scripts/import-prices.js")))||cwd;
          phase="ENVIRONMENT";
          process.chdir(cwd);
          for(const p of [path.join(root,".env"),path.join(cwd,".env")])if(fs.existsSync(p)&&process.loadEnvFile)process.loadEnvFile(p);
          for(const k of ["DATABASE_URL","DATA_DIR","APP_ROOT"])if(meta[k]||meta.env?.[k])process.env[k]=meta[k]||meta.env[k];
          const req=require("module").createRequire(path.join(root,"package.json"));
          const candidates=[process.env.DATA_DIR,meta.DATA_DIR,meta.env?.DATA_DIR,path.join(require("os").homedir(),"kosmetichka-data"),path.join(root,"data"),path.join(cwd,"data")].filter(Boolean).map(p=>path.join(p,"1c","offers.xml")).filter(p=>fs.existsSync(p));
          const file=candidates.sort((a,b)=>fs.statSync(b).mtimeMs-fs.statSync(a).mtimeMs)[0];
          const say=code=>console.log("PRICE_IMPORT_RESULT: "+code);
          if(!file){say("PRICE_FILE_NOT_RECEIVED");return;}
          phase="IMPORT_SOURCE";
          const importer=fs.readFileSync(path.join(root,"scripts/import-prices.js"),"utf8");
          if(!importer.includes("promo_wholesale")||!fs.existsSync(path.join(root,"scripts/price-types.js"))){say("IMPORT_SOURCE_NEEDS_UPDATE");return;}
          phase="XML_PARSE";
          const {XMLParser}=req("fast-xml-parser");
          const parsed=new XMLParser({ignoreAttributes:false,attributeNamePrefix:""}).parse(fs.readFileSync(file,"utf8"));
          const packages=parsed?.КоммерческаяИнформация?.ПакетПредложений;
          const list=v=>v==null?[]:Array.isArray(v)?v:[v];
          const types=new Map(),offers=[];
          for(const p of list(packages)){
          for(const t of list(p.ТипыЦен?.ТипЦены))types.set(String(t.Ид),String(t.Наименование||"").toLowerCase());
          offers.push(...list(p.Предложения?.Предложение));
          }
          const opt=new Set([...types].filter(([,n])=>n.includes("акци")&&n.includes("опт")).map(([id])=>id));
          if(!opt.size){say("PROMO_TARIFFS_NOT_INCLUDED_IN_1C_EXPORT");return;}
          const hasPromo=offers.some(o=>list(o.Цены?.Цена).some(p=>opt.has(String(p.ИдТипаЦены))&&Number(p.ЦенаЗаЕдиницу)>0));
          if(!hasPromo){say("PROMO_TARIFFS_HAVE_NO_PRODUCT_PRICES");return;}
          phase="DATABASE";
          const {PrismaClient}=req("@prisma/client");const db=new PrismaClient();
          try{
          phase="IMPORT_LOG";
          let log="";
          for(const logPath of [meta.pm_out_log_path,meta.pm_err_log_path].filter(Boolean)){
          if(!fs.existsSync(logPath))continue;
          const fd=fs.openSync(logPath,"r"),sz=fs.fstatSync(fd).size,b=Buffer.alloc(Math.min(sz,600000));
          fs.readSync(fd,b,0,b.length,Math.max(0,sz-b.length));fs.closeSync(fd);log+="\n"+b.toString("utf8");
          }
          if(/Cannot find module[^\\n]*sync-all/.test(log))say("SYNC_SCRIPT_PATH_ERROR");
          if(/Cannot find module[^\\n]*price-types|ERR_MODULE_NOT_FOUND/.test(log))say("IMPORT_MODULE_LOAD_ERROR");
          if(/ENOENT[^\\n]*offers.xml|ENOENT[^\\n]*import.xml/.test(log))say("EXCHANGE_FILE_PATH_ERROR");
          if(/PrismaClientValidationError/.test(log))say("DATABASE_VALIDATION_ERROR_SEEN");
          if(/ReferenceError/.test(log))say("SCRIPT_REFERENCE_ERROR_SEEN");
          phase="DATABASE";
          phase="PRICE_RECOVERY_VALIDATE";
          const normalizer=(await import(require("url").pathToFileURL(path.join(root,"scripts/price-types.js")).href)).normalizePriceType;
          const allowed=new Set(["retail","discount","wholesale","big_wholesale","promo_retail","promo_wholesale","promo_big_wholesale"]);
          const mapped=new Map([...types].map(([id,name])=>[id,normalizer(name)]));
          if([...opt].some(id=>!["promo_wholesale","promo_big_wholesale"].includes(mapped.get(id)))){say("PROMO_PRICE_MAPPING_ERROR");return;}
          const products=await db.product.findMany({select:{guid:true}});
          const known=new Set(products.map(p=>p.guid)), priceRows=new Map();
          let variantOnly=false;
          for(const offer of offers){
          const guid=String(offer.Ид);
          if(!known.has(guid)){if(known.has(guid.split("#")[0]))variantOnly=true;continue;}
          for(const price of list(offer.Цены?.Цена)){
          const type=mapped.get(String(price.ИдТипаЦены));
          if(!allowed.has(type))continue;
          const value=Number(price.ЦенаЗаЕдиницу);
          if(!Number.isFinite(value)||value<0)throw Error("invalid_price");
          priceRows.set(guid+"|"+type,{productGuid:guid,priceType:type,price:Math.round(value*100)/100});
          }}
          const rows=[...priceRows.values()];
          if(!rows.some(p=>p.priceType.startsWith("promo_")&&p.price>0)){say(variantOnly?"VARIANT_IDENTIFIERS_REQUIRE_IMPORT_FIX":"NO_MATCHING_PRODUCTS_FOR_PROMO_PRICES");return;}
          const sample=await db.product.findFirst({where:{barcode:"8806334355135"},select:{id:true,updatedAt:true}});
          if(sample){
          const live=await fetch("http://127.0.0.1:3000/api/products/"+sample.id,{headers:{Host:"kosmetichka-opt.ru","X-Forwarded-Proto":"https"},signal:AbortSignal.timeout(15000)});
          const publicProduct=await live.json();
          if(!live.ok||publicProduct.updatedAt!==sample.updatedAt.toISOString())throw Error("database_verification_failed");
          }
          phase="PRICE_RECOVERY_BACKUP";
          const before=await db.productPrice.findMany({where:{priceType:{in:[...allowed]}},select:{productGuid:true,priceType:true,price:true}});
          const backupDir=path.join(require("os").homedir(),".kosmetichka-private-backups");
          fs.mkdirSync(backupDir,{recursive:true,mode:0o700});
          fs.writeFileSync(path.join(backupDir,"price-recovery-"+Date.now()+".json"),JSON.stringify({at:new Date().toISOString(),before,incoming:rows}),{mode:0o600,flag:"wx"});
          const fingerprint=fs.statSync(file).mtimeMs;
          phase="PRICE_RECOVERY_TRANSACTION";
          if(Date.now()-fingerprint>2*60*60*1000)throw Error("stale_exchange_file");
          const sql='INSERT INTO "ProductPrice" ("productGuid","priceType","price","createdAt","updatedAt") SELECT x."productGuid",x."priceType",x.price,NOW(),NOW() FROM jsonb_to_recordset($1::jsonb) AS x("productGuid" text,"priceType" text,price double precision) ON CONFLICT ("productGuid","priceType") DO UPDATE SET price=EXCLUDED.price,"updatedAt"=NOW() WHERE "ProductPrice".price IS DISTINCT FROM EXCLUDED.price';
          await db.$transaction(async tx=>{
          if(fs.statSync(file).mtimeMs!==fingerprint)throw Error("exchange_changed");
          for(let i=0;i<rows.length;i+=500)await tx.$executeRawUnsafe(sql,JSON.stringify(rows.slice(i,i+500)));
          },{timeout:60000});
          say("PROMOTIONAL_PRICES_RECOVERED_WITH_PRIVATE_BACKUP");
          phase="DATABASE";
          const any=await db.productPrice.findFirst({where:{priceType:{in:["promo_wholesale","promo_big_wholesale"]},price:{gt:0}},select:{id:true}});
          if(!any){say("PROMO_PRICES_RECEIVED_BUT_NOT_IMPORTED");return;}
          const item=await db.product.findFirst({where:{barcode:"8806334355135"},select:{guid:true,prices:{select:{priceType:true,price:true}}}});
          if(item){
          const row=offers.find(o=>String(o.Ид)===item.guid);
          const xmlHas=row&&list(row.Цены?.Цена).some(p=>opt.has(String(p.ИдТипаЦены))&&Number(p.ЦенаЗаЕдиницу)>0);
          const dbHas=item.prices.some(p=>["promo_wholesale","promo_big_wholesale"].includes(p.priceType)&&p.price>0);
          say(dbHas?"PROMO_IMPORTED_FOR_SCREENSHOT_PRODUCT":xmlHas?"SCREENSHOT_PRODUCT_PROMO_NOT_IMPORTED":"NO_PROMO_IN_EXPORT_FOR_SCREENSHOT_PRODUCT");
          }else say("PROMO_PRICES_IMPORTED");
          }finally{await db.$disconnect();}
          })().catch(e=>{const code=typeof e?.code==="string"&&/^[A-Z0-9_]+$/.test(e.code)?e.code:"ERROR";console.error("PRICE_IMPORT_RESULT: DIAGNOSTIC_FAILED_"+phase+"_"+code);process.exitCode=1;});
          
          NODE
