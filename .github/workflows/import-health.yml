name: Audit full catalog price source
on:
  push:
    branches: [codex/diagnose-promo-import]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check import state without exporting production data
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o ServerAliveInterval=30 "${USER:-root}@$HOST" "bash -lc 'node --no-warnings'" <<'NODE'
          const fs=require("fs"),path=require("path"),cp=require("child_process");
          let phase="PROCESS";
          (async()=>{
          const apps=JSON.parse(cp.execFileSync("pm2",["jlist"],{encoding:"utf8",maxBuffer:20*1024*1024}));
          const app=apps.find(a=>a.name==="kosmetichka");if(!app)throw Error("no_app");
          const meta=app.pm2_env,cwd=meta.pm_cwd;
          const execDir=path.dirname(meta.pm_exec_path||cwd);
          const roots=[meta.APP_ROOT,meta.env?.APP_ROOT,cwd,path.resolve(cwd,"../.."),execDir,path.resolve(execDir,"../..")].filter(Boolean);
          const root=roots.find(p=>fs.existsSync(path.join(p,"scripts/import-prices.js")))||cwd;
          phase="ENVIRONMENT";
          process.chdir(cwd);
          for(const p of [path.join(root,".env"),path.join(cwd,".env")])if(fs.existsSync(p)&&process.loadEnvFile)process.loadEnvFile(p);
          for(const k of ["DATABASE_URL","DATA_DIR","APP_ROOT"])if(meta[k]||meta.env?.[k])process.env[k]=meta[k]||meta.env[k];
          const req=require("module").createRequire(path.join(root,"package.json"));
          const say=code=>console.log("PRICE_IMPORT_RESULT: "+code);
          phase="ONEC_SCHEMA";
          const {pathToFileURL}=require("url");
          const odata=await import(pathToFileURL(path.join(root,"scripts/onec-odata.js")).href);
          if(!odata.odataConfigured())throw Error("no_connection");
          const {PrismaClient}=req("@prisma/client");const db=new PrismaClient();
          try{
          const item=await db.product.findFirst({where:{article:"ЦБ000000475"},select:{guid:true}});
          if(!item)throw Error("no_control_product");
          const rows=await odata.odataGet("InformationRegister_ЦеныНоменклатуры/SliceLast()",{$filter:"Номенклатура_Key eq guid'"+item.guid+"'",$top:"100"});
          if(!Array.isArray(rows)||!rows.length)throw Error("no_slice");
          const keys=Object.keys(rows[0]).filter(k=>!k.startsWith("odata."));
          const typeKey=keys.find(k=>/Вид.*Цен.*_Key/.test(k));
          const characteristic=keys.find(k=>/Характеристик.*_Key/.test(k));
          say(typeKey?"PRICE_TYPE_FIELD_FOUND":"PRICE_TYPE_FIELD_NOT_FOUND");
          say(rows.every(r=>r.Номенклатура_Key===item.guid)?"CONTROL_PRODUCT_SLICE_VALID":"CONTROL_PRODUCT_SLICE_INVALID");
          if(characteristic)say(rows.every(r=>!r[characteristic]||r[characteristic]==="00000000-0000-0000-0000-000000000000")?"CONTROL_PRICES_WITHOUT_CHARACTERISTICS":"CONTROL_HAS_CHARACTERISTIC_PRICES");
          say("PRICE_SLICE_AVAILABLE");
          }finally{await db.$disconnect();}
          })().catch(()=>{console.error("PRICE_IMPORT_RESULT: AUDIT_FAILED_"+phase);process.exitCode=1;});
          NODE
