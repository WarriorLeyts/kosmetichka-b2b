name: Remove narrow promotion strip from home and catalog
on:
  push:
    branches: [codex/publish-cart-fix]
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install verified public storefront build
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o ServerAliveInterval=30 "${USER:-root}@$HOST" "bash -lc 'python3 -'" <<'PY'
          import os, re, io, tarfile, hashlib, urllib.request, subprocess, tempfile, pathlib, shutil, gzip
          URL = "https://github.com/WarriorLeyts/kosmetichka-app/releases/download/web-latest/kosmetichka-web.tar.gz"
          DIGEST = "5a7842193cc08f2bbb237fcd12810a43d32ef5a2e6ad60679a72e80a8358bf7d"
          OLD = "entry-d0cad25bf0891e9f105a77ee3d2a5563.js"
          NEW = "entry-f2732e6bf4b1dae3d584ac2c12793a20.js"
          # Configuration stays on the server. Only deployment status is printed to Actions.
          config = subprocess.run(["nginx", "-T"], capture_output=True, text=True, check=True).stdout
          roots = set()
          for raw in re.findall(r"(?m)^\s*(?:root|alias)\s+([^;]+);", config):
              raw = raw.strip().strip('"').strip("'")
              if not raw.startswith("/") or "$" in raw: continue
              p = pathlib.Path(raw).resolve()
              index = p / "index.html"
              if p != pathlib.Path("/") and index.is_file():
                  content = index.read_text(errors="replace")
                  if OLD in content or NEW in content: roots.add(p)
          if len(roots) != 1: raise RuntimeError("Could not identify one matching customer storefront; no files changed")
          root = next(iter(roots))
          request = urllib.request.Request(URL, headers={"User-Agent": "Kosmetichka-website-deployment"})
          archive = urllib.request.urlopen(request, timeout=90).read()
          if hashlib.sha256(archive).hexdigest() != DIGEST: raise RuntimeError("Release checksum mismatch; no files changed")
          with tempfile.TemporaryDirectory(prefix="kosmetichka-cart-publish-") as tmp:
              stage = pathlib.Path(tmp) / "stage"
              stage.mkdir()
              with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as tar:
                  for member in tar.getmembers():
                      p = pathlib.PurePosixPath(member.name)
                      if p.is_absolute() or ".." in p.parts or member.issym() or member.islnk():
                          raise RuntimeError("Unsafe archive member; no files changed")
                  tar.extractall(stage, filter="data")
              index = stage / "index.html"
              if not index.is_file() or NEW not in index.read_text(): raise RuntimeError("Unexpected storefront build; no files changed")
              files = [p for p in stage.rglob("*") if p.is_file()]
              for p in files:
                  dest = (root / p.relative_to(stage)).resolve()
                  if root not in dest.parents: raise RuntimeError("Destination leaves storefront directory; no files changed")
              backup = pathlib.Path(tempfile.mkdtemp(prefix="kosmetichka-cart-index-backup-"))
              shutil.copy2(root / "index.html", backup / "index.html")
              # Keep existing hashed assets for browsers still using the preceding build.
              for p in files:
                  relative = p.relative_to(stage)
                  if str(relative) in ("index.html", "index.html.gz"): continue
                  dest = root / relative
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, dest)
              pending = root / ".cart-fix-index.pending"
              shutil.copy2(index, pending)
              if (root / "index.html.gz").exists():
                  pending_gz = root / ".cart-fix-index.gz.pending"
                  with open(index, "rb") as source, gzip.open(pending_gz, "wb") as zipped: shutil.copyfileobj(source, zipped)
                  os.replace(pending_gz, root / "index.html.gz")
              os.replace(pending, root / "index.html")
              # Nginx may serve precompressed HTML to browsers; retire stale Brotli copies
              # and rebuild gzip copies from the newly published HTML, keeping backups.
              for html in [p for p in files if p.suffix == ".html"]:
                  dest = root / html.relative_to(stage)
                  br = pathlib.Path(str(dest) + ".br")
                  gz = pathlib.Path(str(dest) + ".gz")
                  if br.is_file():
                      saved = backup / br.relative_to(root)
                      saved.parent.mkdir(parents=True, exist_ok=True)
                      os.replace(br, saved)
                  if gz.is_file():
                      fresh = pathlib.Path(str(gz) + ".cart-fix-pending")
                      with open(dest, "rb") as source, gzip.open(fresh, "wb") as zipped: shutil.copyfileobj(source, zipped)
                      os.replace(fresh, gz)
          print("Customer storefront published without narrow home and catalog promotion strip")
          
          PY
      - name: Check published customer storefront
        run: |
          curl --fail --silent --show-error --retry 3 https://kosmetichka-opt.ru/cart | grep -q 'entry-f2732e6bf4b1dae3d584ac2c12793a20.js'
          curl --fail --silent --show-error --compressed --retry 3 https://kosmetichka-opt.ru/cart | grep -q 'entry-f2732e6bf4b1dae3d584ac2c12793a20.js'
          echo 'Verified storefront build is served in plain and compressed responses'
